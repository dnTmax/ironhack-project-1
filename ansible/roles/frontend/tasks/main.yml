---
- name: Vote (port 8080 sur l'hote)
  community.docker.docker_container:
    name: vote
    image: "{{ dockerhub_username }}/vote:{{ app_tag }}"
    pull: true
    restart_policy: unless-stopped
    ports:
      - "8080:80"
    env:
      REDIS_HOST: "{{ redis_host }}"
      REDIS_PORT: "6379"

- name: Result (port 8081 sur l'hote)
  community.docker.docker_container:
    name: result
    image: "{{ dockerhub_username }}/result:{{ app_tag }}"
    pull: true
    restart_policy: unless-stopped
    ports:
      - "8081:80"
    env:
      PG_HOST: "{{ postgres_host }}"
      PG_PORT: "5432"
      PG_USER: "{{ postgres_user }}"
      PG_PASSWORD: "{{ postgres_password }}"
      PG_DATABASE: "{{ postgres_database }}"
  no_log: true

- name: Installer nginx
  ansible.builtin.apt:
    name: nginx
    state: present

# Le site nginx par defaut sert deja /var/www/html/index.html :
# on remplace simplement la page, pas besoin de config nginx supplementaire.
- name: Page d'accueil statique
  ansible.builtin.template:
    src: index.html.j2
    dest: /var/www/html/index.html
    mode: "0644"

- name: nginx demarre et active au boot
  ansible.builtin.service:
    name: nginx
    state: started
    enabled: true
